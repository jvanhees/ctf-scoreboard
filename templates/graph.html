{% extends "base.html" %}
{% block body %}
<div class="bar">
  <a class="pill back" href="/?window={{ minutes }}">back</a>
  {% for t in toggle %}
  <a class="pill{% if t.on %} on{% endif %}" href="{{ t.url }}">{{ t.label }}</a>
  {% endfor %}
</div>
{% if c %}
<svg viewBox="-50 -10 {{ c.w + 60 }} {{ c.h + 30 }}" width="100%" style="max-width:{{ c.w + 60 }}px">
  <line x1="0" y1="{{ c.h }}" x2="{{ c.w }}" y2="{{ c.h }}" stroke="#1f344a"/>
  <polyline points="{{ c.pts }}" fill="none" stroke="#3ddc97" stroke-width="2"/>
  <g fill="#6b8299" font-size="12">
    <text x="-8" y="5" text-anchor="end">{{ '%g'|format(c.hi) }}</text>
    <text x="-8" y="{{ c.h }}" text-anchor="end">{{ '%g'|format(c.lo) }}</text>
    <text x="0" y="{{ c.h + 20 }}">{{ c.t0|hm }}</text>
    <text x="{{ c.w }}" y="{{ c.h + 20 }}" text-anchor="end">{{ c.t1|hm }}</text>
  </g>
</svg>
{% else %}
<p>Not enough data yet.</p>
{% endif %}
{% endblock %}
