{% macro strip(statuses, height=6) -%}
{# shortcut: one slot per scrape, so periods where the scraper itself failed are not visible #}
<svg class="strip" viewBox="0 0 {{ statuses|length }} 1" preserveAspectRatio="none" shape-rendering="crispEdges" style="height:{{ height }}px">
{%- for s in statuses %}<rect x="{{ loop.index0 }}" width="1.05" height="1" fill="{{ status_color.get(s, '#6b8299') }}"/>{% endfor -%}
</svg>
{%- endmacro %}

{% macro metric(m) -%}
<a href="{{ m.url }}" class="m{% if m.gain == 0 %} zero{% endif %}{% if m.ratio %} hot {{ m.kind }}{% endif %}"
   title="now {{ m.current }}{% if m.expected is not none %}, normal ~{{ '%.0f'|format(m.expected) }}{% endif %}">
<span class="k">{{ m.label }}</span><span>{% if m.ratio %}<b>{{ m.ratio|spike }}</b>{% endif %}{{ '%+d'|format(m.gain) }}</span></a>
{%- endmacro %}
